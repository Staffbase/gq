name: Release

# Every type commitlint.config.mjs accepts must also appear in changelog-sections
# in release-please-config.json, so nothing that passes CI gets dropped on the
# floor at changelog time. Marking a section hidden is safe: it only controls what
# gets rendered. release-please derives the version bump from the commit types
# themselves and never reads changelog-sections, so a hidden type still cuts a
# release.

# Do not edit the release PR body above its version heading. release-please reads
# the body back to build the GitHub release notes, and expects the `## [x.y.z]`
# heading to be the first thing after the `---`. Anything above it and the notes
# come out empty. Put a summary under the heading instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # Unprefixed (0.1.0, not v0.1.0) — that is what the formula's version field wants.
      version: ${{ steps.release.outputs.version }}
    steps:
      # App token, not GITHUB_TOKEN: a PR authored by github-actions[bot] has its
      # checks held at "workflows awaiting approval", so every release would need
      # someone to click Approve before CI starts.
      - name: Obtain App Token for the release PR
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: release_token
        with:
          client-id: ${{ vars.STAFFBASE_ACTIONS_CLIENT_ID }}
          private-key: ${{ secrets.STAFFBASE_ACTIONS_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.release_token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: release-please
    # !cancelled() rather than success(): release-please pushes the tag and cuts
    # the release before its last few steps, so a late failure there used to mean
    # a tagged release with no binaries attached to it. If there is a tag, build.
    if: >
      ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    steps:
      # Check out the tag release-please just pushed, not the branch head:
      # goreleaser derives the version from the tag on HEAD. fetch-depth 0 brings
      # the tags along, without which it would build a dirty snapshot version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Catches a main that went red between merge and release.
      - run: go test ./...

      # release-please has already created the GitHub release with its notes;
      # `mode: append` in .goreleaser.yml adds the binaries to it rather than
      # replacing what release-please wrote.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.15.4"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # owner + repositories are required: without them the token only covers this repo.
      - name: Obtain App Token for the Homebrew tap
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap_token
        with:
          client-id: ${{ vars.STAFFBASE_ACTIONS_CLIENT_ID }}
          private-key: ${{ secrets.STAFFBASE_ACTIONS_PRIVATE_KEY }}
          owner: Staffbase
          repositories: homebrew-homebrew

      # Rewrites version, the four URLs and the four sha256s in the tap formula,
      # in place. Not goreleaser's `brews:` block, which regenerates the formula
      # wholesale and would drop the hand-written gq-grafana-mcp wrapper it ships.
      - name: Bump Homebrew formula
        env:
          GH_TOKEN: ${{ steps.tap_token.outputs.token }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "staffbase-actions tap token unavailable — skipping Homebrew formula bump."
            exit 0
          fi
          # `version` is set dynamically by release-please-action, not declared in
          # its action.yml, so a rename on a future bump would surface here as an
          # empty string rather than a build error. Empty sails straight through
          # the rewrite below and publishes a formula pinned to version "" with
          # /download/v/ URLs — broken for everyone, and only noticed on the next
          # brew install. Refuse to guess.
          if ! printf '%s' "${VERSION:-}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "release-please gave no usable version (got '${VERSION:-}') — refusing to touch the tap." >&2
            exit 1
          fi

          repo="Staffbase/homebrew-homebrew"
          path="Formula/gq.rb"

          # Also probes existence: skip rather than fail if the formula is gone.
          if ! blob_sha="$(gh api "repos/$repo/contents/$path" --jq .sha 2>/dev/null)"; then
            echo "$path not found on $repo — skipping bump."
            exit 0
          fi
          gh api "repos/$repo/contents/$path" -H "Accept: application/vnd.github.raw" > formula.rb
          cp formula.rb formula.orig.rb

          python3 - "$VERSION" "$PWD/dist/checksums.txt" "$PWD/formula.rb" <<'PY'
          import re, sys, pathlib
          version, sums_path, formula_path = sys.argv[1], sys.argv[2], sys.argv[3]

          sums = {}
          for line in open(sums_path):
              parts = line.split()
              if len(parts) == 2:
                  sums[parts[1].rsplit("/", 1)[-1]] = parts[0]  # basename -> sha256

          expected = {
              "gq_Darwin_arm64.tar.gz",
              "gq_Darwin_x86_64.tar.gz",
              "gq_Linux_arm64.tar.gz",
              "gq_Linux_x86_64.tar.gz",
          }
          missing = expected - set(sums)
          if missing:
              sys.exit(f"checksums.txt is missing checksums for: {sorted(missing)}")

          text = pathlib.Path(formula_path).read_text()
          # Function (not string) replacements: a value with backslashes or group-refs is
          # never interpreted by re.sub's replacement mini-language.
          text = re.sub(r'version "[^"]+"', lambda _m: f'version "{version}"', text, count=1)
          text = re.sub(r"/download/v[0-9][^/]*/", lambda _m: f"/download/v{version}/", text)

          # The asset basename in each url selects the checksum for the sha256 line
          # below it, so reordering the platform blocks stays correct.
          out, current, applied = [], None, set()
          for line in text.splitlines(keepends=True):
              m = re.search(r'/(gq_[A-Za-z0-9_]+\.tar\.gz)"', line)
              if "url " in line and m:
                  current = m.group(1)
              if 'sha256 "' in line and current and current in sums:
                  sha = sums[current]
                  line = re.sub(r'sha256 "[0-9a-f]+"', lambda _m: f'sha256 "{sha}"', line)
                  applied.add(current)
                  current = None
              out.append(line)

          if applied != expected:
              sys.exit(f"Updated sha256 for {sorted(applied)}, expected {sorted(expected)} "
                       "— formula and checksums.txt disagree.")

          pathlib.Path(formula_path).write_text("".join(out))
          PY

          if cmp -s formula.rb formula.orig.rb; then
            echo "Formula already at ${VERSION} — nothing to bump."
            exit 0
          fi
          gh api --method PUT "repos/$repo/contents/$path" \
            -f message="gq: bump to ${VERSION}" \
            -f branch="main" \
            -f sha="$blob_sha" \
            -f content="$(base64 -w0 < formula.rb)"
          echo "Bumped ${repo} formula to ${VERSION}."
