name: Conventional Commits

# Deliberately no paths filter. This is a required status check, and a required
# check that never runs leaves a PR waiting on a status forever — plenty of PRs
# here touch only markdown or workflow files.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  # The job key is the status check context required by the CI/CD ruleset.
  # Do not add a `name:` here — that would rename the context and the ruleset
  # would wait forever for a check that no longer reports under that name.
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      # Merges are squash-only with PR_TITLE, so the title becomes the commit
      # subject release-please parses. Keep in sync with commitlint.config.mjs.
      - name: Lint the pull request title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            perf
            test
            build
            ci
            revert
            style

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lint the commit subjects
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
