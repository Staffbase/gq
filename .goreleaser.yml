version: 2

project_name: gq

before:
  hooks:
    - go vet ./...

builds:
  - id: gq
    main: ./cmd/gq
    binary: gq
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: gq
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CLA.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# release-please owns the release notes: it writes CHANGELOG.md and creates the
# GitHub release before goreleaser runs. Leaving this on would append a second,
# differently-filtered copy of the same commits underneath them.
changelog:
  disable: true

release:
  draft: false
  prerelease: auto
  # The release already exists (release-please created it) — append the archives
  # and checksums to it instead of failing or overwriting the notes.
  mode: append
  replace_existing_artifacts: true
  # No header: release-please's notes already open with the version heading.
  footer: |
    **Install:**
    ```sh
    # via mise (pre-built binary):
    mise use --global github:Staffbase/gq@{{ .Tag }}

    # or download a tarball from the assets above and put `gq` on your PATH.
    ```
